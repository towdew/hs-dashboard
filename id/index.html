<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LG ID Dashboard</title>
<link rel="icon" type="image/x-icon" href="../it/favicon.ico">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=0.1.1">
</head>
<body>

<div class="app">

<!-- ══════════════════ SIDEBAR ══════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sb-logo">
    <button class="sb-toggle-btn" onclick="toggleSidebar()" title="메뉴 펼치기/닫기" aria-label="메뉴 펼치기/닫기">
      <div class="hb"><span></span><span></span><span></span></div>
    </button>
    <div class="sidebar-text-group">
      <div class="sb-logo-text">ID Dashboard</div>
      <div class="sb-logo-sub">Jira follow-up · ID 사업부</div>
    </div>
  </div>

  <div class="sb-section" id="ticketNavList">
    <div class="sb-section-label">Overview</div>
    <div class="nav-item active" data-key="overview" onclick="switchTicket(this)">
      <span class="ni-text" data-abbr="ID">ID 업무 현황</span>
      <span class="ni-badge ni-badge-muted" id="navTotalBadge">-</span>
    </div>
    <div class="sb-section-label" style="margin-top:10px">Tickets</div>
    <div class="nav-item loading-nav" data-key="loading">
      <span class="ni-text" data-abbr="--">Loading...</span>
    </div>
  </div>

  <div class="sb-foot" id="sbFoot">Jira 기준 —</div>
</aside>

<div class="sidebar-backdrop" id="sbBackdrop" onclick="closeMobileSidebar()"></div>

<!-- ══════════════════ MAIN ══════════════════ -->
<div class="main" id="mainArea">

  <div class="topbar">
    <button class="mobile-menu-btn" onclick="openMobileSidebar()" aria-label="메뉴 열기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="topbar-titlewrap">
      <span class="topbar-title" id="topTitle">ID 업무 현황</span>
      <button type="button" class="topbar-link-btn" onclick="copyTicketLink()" title="이 화면 링크 복사 (?ticket=…)" aria-label="이 화면 링크 복사"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></button>
    </div>
    <span class="topbar-meta" id="topMeta">Jira 기준 —</span>
    <div class="topbar-search">
      <svg class="topbar-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="ticketSearch" class="topbar-search-input" type="search" autocomplete="off" spellcheck="false"
             placeholder="티켓 번호, 제목, 담당자 검색" aria-label="티켓 검색" oninput="onSearchInput(this.value)">
    </div>
    <div class="topbar-right">
      <a class="topbar-btn" id="topJiraLink" href="https://lge-gmc.atlassian.net/" target="_blank" rel="noopener" style="display:none">Jira에서 열기 ↗</a>
    </div>
  </div>

  <div class="content-wrap" id="contentWrap">
    <div class="dashboard-loading-shell" id="dashboardLoading">
      <div class="dashboard-loading-card">
        <div class="dashboard-loading-head"><span class="dashboard-loading-dot"></span><span>ID Jira 티켓 현황</span></div>
        <div class="dashboard-loading-sub">tickets.json을 불러오는 중입니다</div>
        <div class="dashboard-loading-bar"><span></span></div>
      </div>
    </div>
  </div>

</div><!-- .main -->
</div><!-- .app -->

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>var __BUILD_V = '0.1.1';</script>
<script src="app.js?v=0.1.1"></script>
</body></html>
