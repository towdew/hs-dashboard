<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Dashboard Admin</title>
  <link rel="icon" href="../it/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-mark">AD</div>
      <h1>Dashboard Admin</h1>
      <p>IT · IT/B2B · ID 보드 현황. 접근 키를 입력하세요.</p>
      <form id="gate-form">
        <input id="gate-key" type="password" autocomplete="current-password" placeholder="접근 키" autofocus>
        <button type="submit">들어가기</button>
      </form>
      <p id="gate-err" class="gate-err" hidden>키가 맞지 않습니다.</p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sb-logo">
        <div class="sb-logo-mark">AD</div>
        <div>
          <div class="sb-logo-text">Admin</div>
          <div class="sb-logo-sub">보드 현황 · 비공개</div>
        </div>
      </div>
      <nav class="sb-nav" id="nav"></nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow" id="eyebrow">보드 현황</div>
          <h1 class="heading" id="heading">한눈에 보기</h1>
        </div>
        <button type="button" class="ghost" id="btn-refresh">다시 불러오기</button>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
