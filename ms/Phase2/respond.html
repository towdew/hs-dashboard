:root{--red:#A50034;--ink:#111827;--ink2:#374151;--ink3:#6B7280;--ink4:#9CA3AF;--line:#E5E7EB;--line2:#EEF0F3;--bg:#F3F4F6;--ok:#047857;--okbg:#ECFDF5;--warn:#B45309;--warnbg:#FFFBEB;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Segoe UI","Malgun Gothic",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.ms{font-family:"RS Symbols";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;user-select:none}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(20px,env(safe-area-inset-left,0px));padding-top:env(safe-area-inset-top,0px);min-height:56px;background:var(--red);color:#fff}
.bar .brand{font-size:15px;font-weight:400;letter-spacing:.02em}
.bar .who{font-size:12.5px;font-weight:600;opacity:.92}
main{width:min(720px,100%);margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 56px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(17,24,39,.06),0 12px 32px rgba(17,24,39,.06);overflow:hidden}
.head{padding:28px 32px 22px;border-bottom:1px solid var(--line2)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
h1{margin:6px 0 10px;font-size:24px;line-height:1.3;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.desc{margin:0 0 16px;font-size:14.5px;line-height:1.65;color:var(--ink2)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:13.5px}
.meta dt{color:var(--ink3)}
.meta dd{margin:0;font-weight:700}
.meta dd.due{color:var(--red)}
.body{padding:26px 32px 30px}
.q-k{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
h2{margin:4px 0 16px;font-size:19px;font-weight:800;line-height:1.35}
.prev{margin:-4px 0 14px;padding:10px 12px;border-radius:9px;background:var(--bg);font-size:13px;color:var(--ink2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .r{width:18px;height:18px;border-radius:50%;border:2px solid #C4C9D2;flex-shrink:0;position:relative}
.opt b{display:block;font-size:15px;font-weight:800}
.opt small{font-size:13px;color:var(--ink3)}
.opt:hover{border-color:#C4C9D2}
.opt.on{border-color:var(--ink);background:#FAFBFC;box-shadow:inset 0 0 0 1px var(--ink)}
.opt.on .r{border-color:var(--red)}
.opt.on .r::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--red)}
.opt:has(input:focus-visible){outline:2px solid var(--red);outline-offset:2px}
form{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:6px}
.f > span{font-size:13px;font-weight:700;color:var(--ink2)}
.f em{font-style:normal;color:var(--red)}
.f input,.f textarea{width:100%;padding:11px 12px;border:1px solid #D9DCE3;border-radius:10px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
.f textarea{min-height:86px;resize:vertical}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.f.bad input,.f.bad textarea{border-color:#DC2626}
.f .err{font-size:12px;color:#DC2626;min-height:0}
.act{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line2)}
.act small{font-size:12px;color:var(--ink4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:11px;border:1px solid var(--red);background:var(--red);color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.msg{display:flex;gap:10px;margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.55}
.msg.err{background:#FEF2F2;color:#991B1B}
.msg.info{background:var(--warnbg);color:var(--warn)}
.done{padding:44px 32px 40px;text-align:center}
.done .ic{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--okbg);color:var(--ok);margin-bottom:14px}
.done .ic .ms{font-size:34px}
.done h2{margin:0 0 6px;font-size:21px}
.done p{margin:0 auto;max-width:440px;font-size:14px;line-height:1.6;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;margin:16px 0 4px;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:800}
.chip.proceed{background:var(--okbg);color:var(--ok)}.chip.decline{background:#FEF2F2;color:#B91C1C}.chip.more{background:var(--warnbg);color:var(--warn)}
.quote{margin:12px auto 0;max-width:440px;padding:10px 14px;border-left:3px solid var(--line);background:#F9FAFB;text-align:left;font-size:13.5px;color:var(--ink2);white-space:pre-wrap}
.done .btns{display:flex;justify-content:center;gap:8px;margin-top:22px;flex-wrap:wrap}
.foot{margin:18px 0 0;text-align:center;font-size:12px;color:var(--ink4)}
.test{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:6px;background:#EFF6FF;color:#1D4ED8;font-size:11px;font-weight:800;vertical-align:middle}
.empty{padding:48px 28px;text-align:center;color:var(--ink3)}
@media (max-width:560px){.head,.body{padding-left:20px;padding-right:20px}.row2{grid-template-columns:1fr}h1{font-size:21px}.act{flex-direction:column-reverse;align-items:stretch}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){.opt{transition:none}}
</style>
</head>
<body>
<div class="bar"><span class="brand">LG Global Request</span><span class="who" id="who">Subsidiary Response</span></div>
<main><div class="card" id="app"><div class="empty">Loading…</div></div><p class="foot">LG.com Global Operations · Content Operations Dashboard</p></main>
<script>
(function () {
  'use strict';
  var MS = {"check_circle": 59500, "error": 57344, "schedule": 57746, "mail": 57534, "event": 57935, "person": 59389, "task_alt": 58086, "info": 59534, "refresh": 58837, "language": 59540, "open_in_new": 59541, "send": 57699};
  var ic = function (n) { return '<span class="ms" aria-hidden="true">&#' + MS[n] + ';</span>'; };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var P = {};
  (location.search.slice(1) + '&' + location.hash.replace(/^#/, '')).split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i > 0) { try { P[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); } catch (e) {} }
  });
  var UI = {
    proceed: { title: 'Proceed', desc: 'Yes, we will proceed with this request.' },
    decline: { title: 'Reject', desc: 'No, we will not proceed with this request. (Please add a reason)' },
    more:    { title: 'Under Review', desc: 'We are still checking this internally.' }
  };
  // f = "pdm.bdc.r" → 선택지(p=proceed, d=decline, m=more) · 입력칸(b=name, d=date, c=comments) · r=Reject 사유 필수
  var fp = String(P.f || 'pdm.bdc.r').split('.');
  var CFG = {
    opts: ['proceed', 'decline', 'more'].filter(function (k) { return (fp[0] || 'pdm').indexOf({ proceed: 'p', decline: 'd', more: 'm' }[k]) >= 0; }),
    by: (fp[1] || '').indexOf('b') >= 0, date: (fp[1] || '').indexOf('d') >= 0, comments: (fp[1] || '').indexOf('c') >= 0,
    reasonReq: fp[2] !== 'o',
    q: P.q || 'Will your subsidiary proceed with this Global Request?'
  };
  if (!CFG.opts.length) CFG.opts = ['proceed', 'decline', 'more'];
  var V = { decision: CFG.opts.indexOf(P.d) >= 0 ? P.d : CFG.opts[0] };
  var app = document.getElementById('app');
  if (!P.req || !P.c) { app.innerHTML = '<div class="empty">' + ic('error') + '<p>This response link is incomplete. Please use the button in the email again.</p></div>'; return; }
  document.getElementById('who').textContent = P.c + ' · Response';
  document.title = (P.id || 'Global Request') + ' · ' + P.c + ' · Response';

  function fmtDate(s) { if (!s) return ''; var d = new Date(s + (s.length === 10 ? 'T00:00:00' : '')); return isNaN(d) ? s : d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }
  function fields(dec) {
    var o = [];
    if (dec === 'proceed') { if (CFG.by) o.push(['by', 'Your name', 'text', 0, 'Name / Team']); if (CFG.date) o.push(['golive', 'Expected go-live date', 'date', 0, '']); if (CFG.comments) o.push(['comments', 'Comments', 'textarea', 0, 'Optional']); }
    if (dec === 'decline') { o.push(['reason', 'Reason for rejection', 'textarea', CFG.reasonReq, 'e.g. The product is not sold in our market']); if (CFG.by) o.push(['by', 'Your name', 'text', 0, 'Name / Team']); }
    if (dec === 'more') { if (CFG.by) o.push(['by', 'Your name', 'text', 0, 'Name / Team']); if (CFG.date) o.push(['decisionDate', 'Expected decision date', 'date', 0, '']); if (CFG.comments) o.push(['comments', 'What are you checking?', 'textarea', 0, 'Optional']); }
    return o;
  }
  function one(d) {
    var val = esc(V[d[0]] || ''), id = 'f_' + d[0];
    var input = d[2] === 'textarea' ? '<textarea id="' + id + '" name="' + d[0] + '" placeholder="' + esc(d[4]) + '">' + val + '</textarea>' : '<input id="' + id + '" type="' + d[2] + '" name="' + d[0] + '" value="' + val + '" placeholder="' + esc(d[4]) + '">';
    return '<label class="f' + (d[3] ? ' req' : '') + '" for="' + id + '"><span>' + d[1] + (d[3] ? ' <em>*</em>' : '') + '</span>' + input + '<i class="err"></i></label>';
  }
  var prev = null, busy = false, lastErr = '';
  function head() {
    return '<div class="head"><div class="kicker">' + esc((P.r > 1 ? (P.r == 2 ? '2nd Reminder · ' : 'Final Reminder · ') : '') + 'Pre-review Confirmation · ' + (P.id || P.req)) + (P.test === '1' ? '<span class="test">TEST</span>' : '') + '</div>' +
      '<h1>' + esc(P.t || P.req) + '</h1>' + (P.s ? '<p class="desc">' + esc(P.s) + '</p>' : '') +
      '<dl class="meta"><dt>Subsidiary</dt><dd>' + esc(P.c) + '</dd>' + (P.due ? '<dt>Response due</dt><dd class="due">' + esc(fmtDate(P.due)) + '</dd>' : '') + '</dl></div>';
  }
  function render() {
    var fl = fields(V.decision), html = '', i = 0;
    while (i < fl.length) { if (fl[i + 1] && fl[i][2] !== 'textarea' && fl[i + 1][2] !== 'textarea') { html += '<div class="row2">' + one(fl[i]) + one(fl[i + 1]) + '</div>'; i += 2; } else { html += one(fl[i]); i++; } }
    app.innerHTML = head() +
      '<div class="body"><div class="q-k">Your decision is required</div><h2>' + esc(CFG.q) + '</h2>' +
      (prev ? '<div class="prev">Your current answer: <b>' + esc((UI[prev.decision] || {}).title || prev.decision) + '</b>' + (prev.at ? ' (' + esc(fmtDate(prev.at.slice(0, 10))) + ')' : '') + '. Submitting again will update it.</div>' : '') +
      '<div class="opts" role="radiogroup" aria-label="Decision">' + CFG.opts.map(function (k) {
        return '<label class="opt' + (V.decision === k ? ' on' : '') + '"><input type="radio" name="dec" value="' + k + '"' + (V.decision === k ? ' checked' : '') + '><span class="r"></span><span><b>' + UI[k].title + '</b><small>' + UI[k].desc + '</small></span></label>';
      }).join('') + '</div>' +
      (html ? '<form novalidate>' + html + '</form>' : '') +
      (lastErr ? '<div class="msg err">' + ic('error') + '<span>' + lastErr + '</span></div>' : '') +
      '<div class="act"><small>You can change your answer later from the same email.</small><button type="button" class="btn" id="submit"' + (busy ? ' disabled' : '') + '>' + ic('send') + (busy ? 'Submitting…' : 'Submit Response') + '</button></div></div>';
    Array.prototype.forEach.call(app.querySelectorAll('input[name=dec]'), function (r) { r.addEventListener('change', function () { grab(); V.decision = r.value; lastErr = ''; render(); }); });
    document.getElementById('submit').addEventListener('click', submit);
  }
  function grab() { Array.prototype.forEach.call(app.querySelectorAll('form [name]'), function (x) { V[x.name] = x.value.trim(); }); }
  function payload() {
    var keep = { proceed: ['by', 'golive', 'comments'], decline: ['reason', 'by'], more: ['by', 'decisionDate', 'comments'] }[V.decision];
    var r = { decision: V.decision, by: '', golive: '', reason: '', decisionDate: '', comments: '', at: new Date().toISOString(), source: 'web' };
    keep.forEach(function (k) { r[k] = V[k] || ''; });
    return r;
  }
  function saveLocal(r) {   // 같은 브라우저(운영자 테스트)에서도 대시보드에 바로 반영
    try {
      var db = JSON.parse(localStorage.getItem('msdash.followup.v1') || '{"records":{}}'); db.records = db.records || {};
      var id = P.req + '||' + P.c, rec = db.records[id] || { id: id, req: P.req, reqTitle: P.t || P.req, requestId: P.id || '', country: P.c, sentAt: r.at, rounds: [] };
      rec.response = r; rec.history = (rec.history || []).concat([{ decision: r.decision, reason: r.reason, comments: r.comments, by: r.by, at: r.at, source: 'web' }]);
      rec.seen = false; rec.seenAt = null; if (P.test === '1') rec.test = true;
      db.records[id] = rec; localStorage.setItem('msdash.followup.v1', JSON.stringify(db));
    } catch (e) {}
  }
  function mailFallback(r) {
    var to = P.to || '';
    var subj = '[Response] ' + (P.id || P.req) + ' · ' + P.c + ' · ' + UI[r.decision].title;
    var body = 'Global Request: ' + (P.t || P.req) + '\nRequest ID: ' + (P.id || '') + '\nSubsidiary: ' + P.c + '\nDecision: ' + UI[r.decision].title +
      (r.reason ? '\nReason: ' + r.reason : '') + (r.golive ? '\nExpected go-live: ' + r.golive : '') + (r.decisionDate ? '\nExpected decision date: ' + r.decisionDate : '') +
      (r.comments ? '\nComments: ' + r.comments : '') + (r.by ? '\nName: ' + r.by : '') + '\n\n#fu-response req=' + P.req + '|c=' + P.c + '|d=' + r.decision;
    return 'mailto:' + encodeURIComponent(to).replace(/%40/g, '@').replace(/%2C/g, ',') + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
  }
  function done(r, via) {
    var t = r.reason || r.comments;
    app.innerHTML = head() + '<div class="done"><span class="ic">' + ic('task_alt') + '</span><h2>' + (via === 'mail' ? 'Almost done — please send the email' : 'Your response has been received') + '</h2>' +
      '<p>' + (via === 'mail' ? 'Your mail app opened with your answer filled in. Press <b>Send</b> to deliver it to the Global Operations team.' : 'Thank you. The Global Operations team has been notified. You can close this page.') + '</p>' +
      '<div class="chip ' + r.decision + '">' + ic(r.decision === 'proceed' ? 'check_circle' : r.decision === 'more' ? 'schedule' : 'error') + UI[r.decision].title + '</div>' +
      (t ? '<div class="quote">' + esc(t) + '</div>' : '') +
      '<div class="btns">' + (via === 'mail' ? '<a class="btn" href="' + esc(mailFallback(r)) + '">' + ic('mail') + 'Open email again</a>' : '') + '<button type="button" class="btn ghost" id="again">Change my response</button></div></div>';
    document.getElementById('again').addEventListener('click', function () { prev = r; lastErr = ''; render(); });
  }
  function submit() {
    if (busy) return;
    grab(); lastErr = '';
    var ok = true;
    Array.prototype.forEach.call(app.querySelectorAll('.f.req'), function (f) { var x = f.querySelector('[name]'), bad = !x.value.trim(); f.classList.toggle('bad', bad); f.querySelector('.err').textContent = bad ? 'Required field' : ''; if (bad) ok = false; });
    if (!ok) return;
    var r = payload();
    saveLocal(r);
    if (!P.ep) {   // 응답 수집 서버가 없으면 회신 메일로 전달
      if (!P.to) { done(r, 'local'); return; }
      location.href = mailFallback(r); done(r, 'mail'); return;
    }
    busy = true; render();
    fetch(P.ep, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'respond', req: P.req, requestId: P.id || '', title: P.t || '', country: P.c, test: P.test === '1', response: r, notify: P.to || '' }) })
      .then(function (res) { return res.text(); })
      .then(function (t) { var j = {}; try { j = JSON.parse(t); } catch (e) {} if (!j.ok) throw new Error(j.error || 'Server did not confirm'); busy = false; done(r, 'web'); })
      .catch(function (err) {
        busy = false;
        lastErr = 'We could not submit your response (' + esc(err.message || err) + ').' + (P.to ? ' <a href="' + esc(mailFallback(r)) + '">Send it by email instead</a>.' : ' Please try again.');
        render();
      });
  }
  render();
  // 이미 응답한 적이 있으면 표시
  if (P.ep) {
    fetch(P.ep, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'get', req: P.req, country: P.c }) })
      .then(function (r) { return r.json(); }).then(function (j) { if (j && j.ok && j.response && !busy) { prev = j.response; render(); } }).catch(function () {});
  }
})();
</script>
</body>
</html>
