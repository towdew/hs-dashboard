.page-title-wrap{display:block;margin-bottom:17px}.title-row{display:flex;align-items:center;gap:8px}.page-title-icon{width:16px;height:16px;color:var(--red)}.page-title{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em}.subtitle{margin:5px 0 0;color:#696969;font-size:12px}.help{margin:7px 0 0;color:#74716b;font-size:11px;line-height:1.5}

.grid{display:grid;gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.product{grid-template-columns:minmax(220px,310px) minmax(220px,310px)}.split{display:grid;grid-template-columns:minmax(440px,.9fr) minmax(520px,1.1fr);gap:13px;align-items:start}

.modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.55)}.modal.open{display:flex}.modal-card{width:min(760px,92vw);max-height:88vh;overflow:auto;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.modal-head{display:flex;align-items:center;min-height:48px;padding:0 16px;color:#fff;background:#000}.modal-head h2{margin:0;font-size:14px}.modal-close{margin-left:auto;color:#fff;background:transparent;border:0;font-size:20px}.modal-body{padding:18px}.dimension-preview-images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dimension-preview-images img{width:100%;max-height:300px;object-fit:contain;background:#f4f4f4;border:1px solid var(--border)}.dimension-meta{margin-top:14px;line-height:1.7}

<form id="variationForm" novalidate>
<section class="card"><div class="card-body"><h2 class="section-title">Product Group / Tool</h2><div class="grid product"><label class="field"><span class="required">Product Group</span><select class="control" id="category" required><option value="REF">REF — Refrigerator</option><option value="WM">WM — Washing Machine</option><option value="VC">VC — Vacuum Cleaner</option><option value="COOKING">Cooking</option><option value="DW">Dishwasher</option></select></label><label class="field"><span class="required">Tool</span><select class="control tool-highlight" id="tool" required><option value="F-UB5" selected>F-UB5</option><option value="F-UB1">F-UB1</option><option value="A9X-Lite">A9X-Lite</option></select></label></div><div class="grid two" style="margin-top:12px"><label class="field"><span class="required">Linked Master</span><select class="control" id="linkedMaster" required></select></label><label class="field"><span>Dimension Info</span><select class="control" id="variationDimension"></select></label></div></div></section>

const VM_KEYS={usps:'vmCommonUsps',dimensions:'vmDimensions',masters:'vmMasters',variations:'vmVariations'};
const DEFAULT_USPS=[
 {id:'usp-seamless',category:'REF',name:'Seamless Fit',group:'Key Feature Card (2)',component:'ST0004',xf:'',media:'feature/2-seamless-fit(1).jpg',description:'Reusable seamless installation feature.'},
 {id:'usp-ai',category:'REF',name:'AI Features',group:'Key Feature Card (2)',component:'',xf:'',media:'feature/2-ai-features(1).jpg',description:'Reusable AI feature visual.'},
 {id:'usp-fresh',category:'REF',name:'Max Freshness',group:'Key Feature Card (2)',component:'',xf:'',media:'feature/3-max-freshness(1).jpg',description:'Reusable freshness feature visual.'},
 {id:'usp-storage',category:'REF',name:'Max Storage',group:'Key Feature Card (2)',component:'',xf:'',media:'feature/2-max-storage(1).jpg',description:'Reusable storage feature visual.'}
];
const DEFAULT_DIMENSIONS=[{id:'dim-t1',type:'T1',category:'REF',tool:'F-UB5',width:'697',height:'2030',depth:'704',image1:'dimension/T1.jpg',imageName:'T1.jpg',note:'Standard refrigerator dimension information.'}];
const DEFAULT_MASTERS=[{id:'master-fub5',category:'REF',tool:'F-UB5',name:'F-UB5 Master',subCategory:'Bottom Freezer',saleModel:'GBBS524CEV',factoryModel:'',color:'',metric:'C',wcm:'MTX0407',dam:'',dimensionId:'dim-t1',uspIds:['usp-seamless','usp-ai','usp-fresh','usp-storage'],heads:[{group:'Key Visual (1)',feature:'Key Visual',component:'ST0001',xf:'',media:'feature/1-Key-Visual.mp4'},{group:'Key Feature Card (2)',feature:'Seamless Fit',component:'ST0004',xf:'',media:'feature/2-seamless-fit(1).jpg'},{group:'Key Feature Card (2)',feature:'AI Features',component:'',xf:'',media:'feature/2-ai-features(1).jpg'},{group:'Key Feature Card (2)',feature:'Max Freshness',component:'',xf:'',media:'feature/3-max-freshness(1).jpg'},{group:'Key Feature Card (2)',feature:'Max Storage',component:'',xf:'',media:'feature/2-max-storage(1).jpg'}]}];
function getStore(key,fallback=[]){try{const v=JSON.parse(localStorage.getItem(key));return Array.isArray(v)?v:fallback}catch(e){return fallback}}
function setStore(key,v){localStorage.setItem(key,JSON.stringify(v))}
function seed(){
  if(!localStorage.getItem(VM_KEYS.usps))setStore(VM_KEYS.usps,DEFAULT_USPS);
  if(!localStorage.getItem(VM_KEYS.dimensions))setStore(VM_KEYS.dimensions,DEFAULT_DIMENSIONS);
  if(!localStorage.getItem(VM_KEYS.masters))setStore(VM_KEYS.masters,DEFAULT_MASTERS);
  if(!localStorage.getItem(VM_KEYS.variations))setStore(VM_KEYS.variations,[]);
  const usps=getStore(VM_KEYS.usps);let uspChanged=false;
  usps.forEach(u=>{if(typeof u.media==='string'&&u.media.startsWith('image/')){u.media='feature/'+u.media.slice(6);uspChanged=true}});
  if(uspChanged)setStore(VM_KEYS.usps,usps);
  const dims=getStore(VM_KEYS.dimensions);let dimChanged=false;
  dims.forEach(d=>{
    if(d.id==='dim-t1'&&!d.tool){d.tool='F-UB5';dimChanged=true}
    if(!d.image1&&(d.image||d.image2)){d.image1=d.image||d.image2;dimChanged=true}
    if(d.id==='dim-t1'&&(!d.image1||/T1-dimension-info\.png$/i.test(String(d.image1)))){d.image1='dimension/T1.jpg';d.imageName='T1.jpg';dimChanged=true}
  });
  if(dimChanged)setStore(VM_KEYS.dimensions,dims);
  const masters=getStore(VM_KEYS.masters);let masterChanged=false;
  masters.forEach(m=>(m.heads||[]).forEach(h=>{if(typeof h.media==='string'&&h.media.startsWith('image/')){h.media='feature/'+h.media.slice(6);masterChanged=true}}));
  if(masterChanged)setStore(VM_KEYS.masters,masters);
}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
function initSidebar(){const app=document.getElementById('app');const toggle=()=>app.classList.toggle('collapsed');document.getElementById('collapseTop')?.addEventListener('click',toggle);document.getElementById('collapseHandle')?.addEventListener('click',toggle)}
function fillDimensionSelect(id,selected=''){const sel=document.getElementById(id);if(!sel)return;const dims=getStore(VM_KEYS.dimensions);sel.innerHTML='<option value="">Select Dimension</option>'+dims.map(d=>`<option value="${escapeHtml(d.id)}" ${d.id===selected?'selected':''}>${escapeHtml(d.category)} · ${escapeHtml(d.tool||'-')} · ${escapeHtml(d.type)} · ${escapeHtml(d.width)}×${escapeHtml(d.height)}×${escapeHtml(d.depth)} mm</option>`).join('')}
function fillMasterSelect(id,selected=''){const sel=document.getElementById(id);if(!sel)return;const masters=getStore(VM_KEYS.masters);sel.innerHTML='<option value="">Select Master</option>'+masters.map(m=>`<option value="${escapeHtml(m.id)}" ${m.id===selected?'selected':''}>${escapeHtml(m.tool)} · ${escapeHtml(m.name)} · ${escapeHtml(m.saleModel)}</option>`).join('')}
seed();initSidebar();

let featureValues={};
function selectedMaster(){return getStore(VM_KEYS.masters).find(m=>m.id===document.getElementById('linkedMaster').value)}
function syncMaster(){const m=selectedMaster();if(!m){document.getElementById('featureArea').innerHTML='<div class="empty">Select a Master to load its UFN schema.</div>';return}document.getElementById('category').value=m.category||'REF';document.getElementById('tool').value=m.tool||'F-UB5';document.getElementById('subCategory').value=m.subCategory||'';document.getElementById('variationDimension').value=m.dimensionId||'';featureValues={};const heads=m.heads||[];document.getElementById('featureArea').innerHTML=heads.length?`<table class="feature-table"><thead><tr><th style="width:180px">Group</th><th>Feature</th><th style="width:100px">Component</th><th style="width:100px">Value</th></tr></thead><tbody>${heads.map((h,i)=>`<tr><td>${escapeHtml(h.group)}</td><td>${escapeHtml(h.feature)}</td><td>${escapeHtml(h.component||'-')}</td><td><div class="choice"><button type="button" data-i="${i}" data-v="O">O</button><button type="button" data-i="${i}" data-v="X">X</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">The selected Master has no UFN schema.</div>';document.querySelectorAll('.choice button').forEach(b=>b.onclick=()=>{featureValues[b.dataset.i]=b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.className='');b.className=b.dataset.v==='O'?'active-o':'active-x'})}
document.getElementById('linkedMaster').onchange=syncMaster;
document.getElementById('variationForm').onsubmit=e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;const items=getStore(VM_KEYS.variations);items.push({id:uid('variation'),masterId:document.getElementById('linkedMaster').value,category:document.getElementById('category').value,tool:document.getElementById('tool').value,region:document.getElementById('region').value.trim(),country:document.getElementById('country').value.trim(),subCategory:document.getElementById('subCategory').value.trim(),saleModel:document.getElementById('saleModel').value.trim(),suffix:document.getElementById('suffix').value.trim(),factoryModel:document.getElementById('factoryModel').value.trim(),color:document.getElementById('color').value.trim(),metric:document.getElementById('metric').value.trim(),wcm:document.getElementById('wcm').value.trim(),dam:document.getElementById('dam').value.trim(),dimensionId:document.getElementById('variationDimension').value,featureValues});setStore(VM_KEYS.variations,items);toast('Variation saved.');e.currentTarget.reset();fillMasterSelect('linkedMaster');fillDimensionSelect('variationDimension');featureValues={};syncMaster()};
fillMasterSelect('linkedMaster');fillDimensionSelect('variationDimension');if(document.getElementById('linkedMaster').options.length>1){document.getElementById('linkedMaster').selectedIndex=1;syncMaster()}

const excelImportButton=document.getElementById('excelImport'),excelImportFile=document.getElementById('excelFile');
if(excelImportButton&&excelImportFile){excelImportButton.onclick=()=>excelImportFile.click();excelImportFile.onchange=()=>{const f=excelImportFile.files[0];if(!f)return;document.getElementById('excelStatus').textContent=f.name;toast('Excel file selected: '+f.name);excelImportFile.value=''}}
</script></body></html>
