const VM_KEYS={usps:'vmCommonUsps',dimensions:'vmDimensions',masters:'vmMasters',variations:'vmVariations'};
const DEFAULT_USPS=[
 {id:'usp-seamless',category:'REF',name:'Seamless Fit',group:'Key Feature Card (2)',component:'ST0004',xf:'',media:'feature/2-seamless-fit(1).jpg',description:'Reusable seamless installation feature.'},
 {id:'usp-ai',category:'REF',name:'AI Features',group:'Key Feature Card (2)',component:'',xf:'',media:'feature/2-ai-features(1).jpg',description:'Reusable AI feature visual.'},
 {id:'usp-fresh',category:'REF',name:'Max Freshness',group:'Key Feature Card (2)',component:'',xf:'',media:'feature/3-max-freshness(1).jpg',description:'Reusable freshness feature visual.'},
 {id:'usp-storage',category:'REF',name:'Max Storage',group:'Key Feature Card (2)',component:'',xf:'',media:'feature/2-max-storage(1).jpg',description:'Reusable storage feature visual.'}
];
const DEFAULT_DIMENSIONS=[{id:'dim-t1',type:'T1',category:'REF',tool:'F-UB5',width:'697',height:'2030',depth:'704',image1:'dimension/T1.jpg',imageName:'T1.jpg',note:'Standard refrigerator dimension information.'}];
const DEFAULT_MASTERS=[{id:'master-fub5',category:'REF',tool:'F-UB5',name:'F-UB5 Master',subCategory:'Bottom Freezer',saleModel:'GBBS524CEV',factoryModel:'',color:'',metric:'C',wcm:'MTX0407',dam:'',dimensionId:'dim-t1',uspIds:['usp-seamless','usp-ai','usp-fresh','usp-storage'],heads:[{group:'Key Visual (1)',feature:'Key Visual',component:'ST0001',xf:'',media:'feature/1-Key-Visual.mp4'},{group:'Key Feature Card (2)',feature:'Seamless Fit',component:'ST0004',xf:'',media:'feature/2-seamless-fit(1).jpg'},{group:'Key Feature Card (2)',feature:'AI Features',component:'',xf:'',media:'feature/2-ai-features(1).jpg'},{group:'Key Feature Card (2)',feature:'Max Freshness',component:'',xf:'',media:'feature/3-max-freshness(1).jpg'},{group:'Key Feature Card (2)',feature:'Max Storage',component:'',xf:'',media:'feature/2-max-storage(1).jpg'}]}];
function getStore(key,fallback=[]){try{const v=JSON.parse(localStorage.getItem(key));return Array.isArray(v)?v:fallback}catch(e){return fallback}}
function setStore(key,v){localStorage.setItem(key,JSON.stringify(v))}
function seed(){
  if(!localStorage.getItem(VM_KEYS.usps))setStore(VM_KEYS.usps,DEFAULT_USPS);
  if(!localStorage.getItem(VM_KEYS.dimensions))setStore(VM_KEYS.dimensions,DEFAULT_DIMENSIONS);
  if(!localStorage.getItem(VM_KEYS.masters))setStore(VM_KEYS.masters,DEFAULT_MASTERS);
  if(!localStorage.getItem(VM_KEYS.variations))setStore(VM_KEYS.variations,[]);
  const usps=getStore(VM_KEYS.usps);let uspChanged=false;
  usps.forEach(u=>{if(typeof u.media==='string'&&u.media.startsWith('image/')){u.media='feature/'+u.media.slice(6);uspChanged=true}});
  if(uspChanged)setStore(VM_KEYS.usps,usps);
  const dims=getStore(VM_KEYS.dimensions);let dimChanged=false;
  dims.forEach(d=>{
    if(d.id==='dim-t1'&&!d.tool){d.tool='F-UB5';dimChanged=true}
    if(!d.image1&&(d.image||d.image2)){d.image1=d.image||d.image2;dimChanged=true}
    if(d.id==='dim-t1'&&(!d.image1||/T1-dimension-info\.png$/i.test(String(d.image1)))){d.image1='dimension/T1.jpg';d.imageName='T1.jpg';dimChanged=true}
  });
  if(dimChanged)setStore(VM_KEYS.dimensions,dims);
  const masters=getStore(VM_KEYS.masters);let masterChanged=false;
  masters.forEach(m=>(m.heads||[]).forEach(h=>{if(typeof h.media==='string'&&h.media.startsWith('image/')){h.media='feature/'+h.media.slice(6);masterChanged=true}}));
  if(masterChanged)setStore(VM_KEYS.masters,masters);
}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
function initSidebar(){const app=document.getElementById('app');const toggle=()=>app.classList.toggle('collapsed');document.getElementById('collapseTop')?.addEventListener('click',toggle);document.getElementById('collapseHandle')?.addEventListener('click',toggle)}
function fillDimensionSelect(id,selected=''){const sel=document.getElementById(id);if(!sel)return;const dims=getStore(VM_KEYS.dimensions);sel.innerHTML='<option value="">Select Dimension</option>'+dims.map(d=>`<option value="${escapeHtml(d.id)}" ${d.id===selected?'selected':''}>${escapeHtml(d.category)} · ${escapeHtml(d.tool||'-')} · ${escapeHtml(d.type)} · ${escapeHtml(d.width)}×${escapeHtml(d.height)}×${escapeHtml(d.depth)} mm</option>`).join('')}
function fillMasterSelect(id,selected=''){const sel=document.getElementById(id);if(!sel)return;const masters=getStore(VM_KEYS.masters);sel.innerHTML='<option value="">Select Master</option>'+masters.map(m=>`<option value="${escapeHtml(m.id)}" ${m.id===selected?'selected':''}>${escapeHtml(m.tool)} · ${escapeHtml(m.name)} · ${escapeHtml(m.saleModel)}</option>`).join('')}
seed();initSidebar();

const form=document.getElementById('dimensionForm');
const imageInput=document.getElementById('dimensionImage');
const imageStatus=document.getElementById('dimensionImageStatus');
const existingImage=document.getElementById('dimensionImageExisting');
function normalizedImage(d){return d.image1||d.image||d.image2||''}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(reader.error||new Error('File read failed'));reader.readAsDataURL(file)})}
function resetImageField(){imageInput.value='';existingImage.value='';imageStatus.textContent='Upload one image only.'}
function render(){
  const q=document.getElementById('dimensionToolSearch').value.trim().toLowerCase();
  const category=document.getElementById('dimensionCategoryFilter').value;
  const all=getStore(VM_KEYS.dimensions);
  const rows=all.filter(d=>(!category||d.category===category)&&String(d.tool||'').toLowerCase().includes(q));
  document.getElementById('dimensionCount').textContent=`${rows.length} item(s)`;
  document.getElementById('dimensionList').innerHTML=rows.length?`<table class="data-table"><thead><tr><th style="width:100px">Category</th><th style="width:180px">Tool Name</th><th style="width:90px">Type</th><th>W × H × D (mm)</th><th style="width:180px">Image</th><th style="width:116px"></th></tr></thead><tbody>${rows.map(d=>{const image=normalizedImage(d);return `<tr><td><span class="badge">${escapeHtml(d.category)}</span></td><td><strong>${escapeHtml(d.tool||'-')}</strong></td><td><span class="dimension-code">${escapeHtml(d.type)}</span></td><td>${escapeHtml(d.width||'-')} × ${escapeHtml(d.height||'-')} × ${escapeHtml(d.depth||'-')}</td><td class="media-name" title="${escapeHtml(d.imageName||image||'')}">${image?escapeHtml(d.imageName||String(image).split('/').pop()||'1 image'):'-'}</td><td class="actions-cell"><button class="icon-btn" data-preview="${d.id}" title="Preview" ${image?'':'disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button><button class="icon-btn" data-edit="${d.id}" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><button class="icon-btn" data-delete="${d.id}" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No Dimension found.</div>';
  document.querySelectorAll('[data-preview]:not([disabled])').forEach(b=>b.onclick=()=>preview(b.dataset.preview));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete));
}
function preview(id){
  const d=getStore(VM_KEYS.dimensions).find(x=>x.id===id);if(!d)return;
  const image=normalizedImage(d);
  document.getElementById('modalBody').innerHTML=`<div class="dimension-preview-images">${image?`<img src="${escapeHtml(image)}" alt="${escapeHtml(d.tool||d.type)} dimension">`:'<div class="empty">No dimension image registered.</div>'}</div><div class="dimension-meta"><strong>Category :</strong> ${escapeHtml(d.category||'-')}<br><strong>Tool Name :</strong> ${escapeHtml(d.tool||'-')}<br><strong>Type :</strong> ${escapeHtml(d.type)}<br><strong>W*H*D :</strong> ${escapeHtml(d.width||'-')} × ${escapeHtml(d.height||'-')} × ${escapeHtml(d.depth||'-')} (mm)${d.note?`<br><strong>Note :</strong> ${escapeHtml(d.note)}`:''}</div>`;
  document.getElementById('dimensionModal').classList.add('open');
}
function edit(id){
  const d=getStore(VM_KEYS.dimensions).find(x=>x.id===id);if(!d)return;
  document.getElementById('editId').value=d.id;
  document.getElementById('dimensionCategory').value=d.category||'REF';
  document.getElementById('dimensionTool').value=d.tool||'';
  document.getElementById('dimensionType').value=d.type||'';
  document.getElementById('dimensionWidth').value=d.width||'';
  document.getElementById('dimensionHeight').value=d.height||'';
  document.getElementById('dimensionDepth').value=d.depth||'';
  document.getElementById('dimensionNote').value=d.note||'';
  existingImage.value=normalizedImage(d);
  imageInput.value='';
  imageStatus.textContent=existingImage.value?`Current image: ${d.imageName||String(existingImage.value).split('/').pop()||'registered image'} · choose a new file to replace it.`:'No image registered. Choose one image.';
  document.getElementById('dimensionSave').textContent='Update Dimension';
  window.scrollTo({top:0,behavior:'smooth'});
}
function del(id){if(!confirm('Delete this Dimension?'))return;setStore(VM_KEYS.dimensions,getStore(VM_KEYS.dimensions).filter(x=>x.id!==id));render();toast('Dimension deleted.')}
form.onsubmit=async e=>{
  e.preventDefault();if(!form.reportValidity())return;
  const file=imageInput.files&&imageInput.files[0];
  if(!file&&!existingImage.value){toast('Please upload one Dimension image.');imageInput.focus();return}
  if(file&&file.size>2.5*1024*1024){toast('Please use an image smaller than 2.5 MB.');return}
  let image1=existingImage.value;
  let imageName='';
  if(file){try{image1=await fileToDataUrl(file);imageName=file.name}catch(err){toast('Could not read the image.');return}}
  const id=document.getElementById('editId').value;
  const current=getStore(VM_KEYS.dimensions).find(x=>x.id===id);
  const item={id:id||uid('dim'),category:document.getElementById('dimensionCategory').value,tool:document.getElementById('dimensionTool').value.trim(),type:document.getElementById('dimensionType').value.trim(),width:document.getElementById('dimensionWidth').value,height:document.getElementById('dimensionHeight').value,depth:document.getElementById('dimensionDepth').value,image1,imageName:imageName||(current&&current.imageName)||'',note:document.getElementById('dimensionNote').value.trim()};
  let arr=getStore(VM_KEYS.dimensions);if(id)arr=arr.map(x=>x.id===id?item:x);else arr.push(item);
  try{setStore(VM_KEYS.dimensions,arr)}catch(err){toast('The image is too large to save in this prototype.');return}
  form.reset();document.getElementById('editId').value='';resetImageField();document.getElementById('dimensionSave').textContent='Save Dimension';render();toast(id?'Dimension updated.':'Dimension saved.');
};
form.onreset=()=>setTimeout(()=>{document.getElementById('editId').value='';resetImageField();document.getElementById('dimensionSave').textContent='Save Dimension'},0);
imageInput.onchange=()=>{const file=imageInput.files&&imageInput.files[0];imageStatus.textContent=file?`Selected: ${file.name}`:(existingImage.value?'Current image will be kept.':'Upload one image only.')};
document.getElementById('dimensionToolSearch').oninput=render;
document.getElementById('dimensionCategoryFilter').onchange=render;
document.getElementById('modalClose').onclick=()=>document.getElementById('dimensionModal').classList.remove('open');
document.getElementById('dimensionModal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')};
render();

const excelImportButton=document.getElementById('excelImport'),excelImportFile=document.getElementById('excelFile');
if(excelImportButton&&excelImportFile){excelImportButton.onclick=()=>excelImportFile.click();excelImportFile.onchange=()=>{const f=excelImportFile.files[0];if(!f)return;document.getElementById('excelStatus').textContent=f.name;toast('Excel file selected: '+f.name);excelImportFile.value=''}}
</script></body></html>
