function set(key,v){try{localStorage.setItem(key,JSON.stringify(v));return true}catch(e){toast('The imported images are too large for browser storage. The current view is available until refresh.');window.__memory=window.__memory||{};window.__memory[key]=v;return false}}

const COMMON_USP_IMAGE_DIRS=['Common-USP','common-usp','./Common-USP','./common-usp'];
const COMMON_USP_IMAGE_EXTS=['png','jpg','jpeg','webp','gif','PNG','JPG','JPEG','WEBP','GIF'];
function commonUspImageCandidates(no,fallback){
  const base=String(no||'').trim();
  const paths=[];
  if(fallback){
    const raw=String(fallback).trim();
    if(raw) paths.push(raw);
    const normalized=raw.replace(/^\.\/feature\/common-usp\//i,'Common-USP/').replace(/^feature\/common-usp\//i,'Common-USP/').replace(/^\.\/common-usp\//i,'Common-USP/').replace(/^common-usp\//i,'Common-USP/');
    if(normalized) paths.push(normalized);
  }
  if(base){
    // Detail rows such as wd-003-1, wd-003-2, ... must resolve their own image first.
    COMMON_USP_IMAGE_DIRS.forEach(dir=>COMMON_USP_IMAGE_EXTS.forEach(ext=>{
      paths.push(`${dir}/${base}.${ext}`);
      const encoded=encodeURIComponent(base);
      if(encoded!==base) paths.push(`${dir}/${encoded}.${ext}`);
    }));
  }
  return [...new Set(paths.filter(Boolean))];
}
function mediaMarkup(d){
  const candidates=commonUspImageCandidates(d.no,d.image);
  const initial=candidates[0]||'';
  return `<img class="usp-detail-media" src="${esc(initial)}" data-no="${esc(d.no||'')}" data-fallback="${esc(d.image||'')}" alt="${esc(d.alt||d.name||'Common USP image')}" loading="eager"><button class="image-expand-btn" type="button" data-image-expand aria-label="View image larger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span>View Larger</span></button><div class="image-empty" style="display:none">Image not found for ${esc(d.no||'this item')}</div>`;
}
function hydrateCommonUspImages(root=document){
  root.querySelectorAll('img.usp-detail-media').forEach(img=>{
    const candidates=commonUspImageCandidates(img.dataset.no,img.dataset.fallback);
    const box=img.closest('.detail-image');const expand=box?.querySelector('[data-image-expand]');const empty=box?.querySelector('.image-empty');
    let index=0;
    let current='';
    try{ current=decodeURI(new URL(img.getAttribute('src')||'',location.href).pathname); }catch(e){}
    const tryNext=()=>{
      while(index<candidates.length){
        const candidate=candidates[index++];
        let candidatePath='';
        try{ candidatePath=decodeURI(new URL(candidate,location.href).pathname); }catch(e){}
        if(current && candidatePath===current) continue;
        img.src=candidate;
        return;
      }
      img.style.display='none';
      if(expand) expand.style.display='none';
      if(empty) empty.style.display='block';
    };
    img.onload=()=>{img.style.display='block';if(expand)expand.style.display='inline-flex';if(empty)empty.style.display='none';};
    img.onerror=tryNext;
    // If the initial URL is blank, start the candidate chain immediately.
    if(!img.getAttribute('src')) tryNext();
  });
}
function field(label,value,full=false){return `<div class="detail-item ${full?'full':''}"><span class="label">${esc(label)}</span><span class="value">${esc(value||'-')}</span></div>`}
function openDetail(id){
  const u=read(KEYS.list,[]).find(x=>x.id===id);if(!u)return;

  const detailHtml=ds.length?ds.map((d,i)=>`<section class="detail-card"><div class="detail-card-title">${esc(d.no||u.no)} · ${esc(d.name||u.name)}<span>${i+1} / ${ds.length}</span></div><div class="detail-layout"><div class="detail-image">${mediaMarkup(d)}</div><div class="detail-content"><div class="detail-grid">${field('Component',d.component)}${field('Eyebrow',d.eyebrow)}${field('Title',d.head,true)}${field('Body',d.body,true)}${field('Disclaimer',d.disclaimer,true)}${field('Image Alt Text',d.alt,true)}${field('Applied PDPs (Tool)',d.appliedTool)}${field('X/F',d.xf)}<div class="detail-item full"><span class="label">Master DAM</span><span class="value">${d.masterDam?`<a class="dam-link" href="${esc(d.masterDam)}" target="_blank" rel="noopener">Open DAM ↗</a>`:'-'}</span></div></div></div></div></section>`).join(''):`<section class="detail-card"><div class="detail-card-title">Detail content</div><div class="empty">No detail record is registered.</div></section>`;
  document.getElementById('modalBody').innerHTML=summary+`<div class="detail-scroll">${detailHtml}</div>`;
  hydrateCommonUspImages(document.getElementById('modalBody'));
  document.getElementById('modalBody').querySelectorAll('[data-image-expand]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const img=btn.closest('.detail-image')?.querySelector('img.usp-detail-media');if(img&&img.style.display!=='none')openImageViewer(img.currentSrc||img.src,img.alt)}));
  const m=document.getElementById('detailModal');m.classList.add('open');m.setAttribute('aria-hidden','false');
}

function editItem(id){const u=read(KEYS.list,[]).find(x=>x.id===id);if(!u)return;const d=detailsFor(u.no)[0]||{};document.getElementById('editId').value=id;document.getElementById('uspNo').value=u.no||'';document.getElementById('uspName').value=u.name||'';document.getElementById('uspApplicable').value=u.applicableProducts||'';document.getElementById('uspCategory').value=u.category||'WM';populateSubcategories(u.subCategory||'');document.getElementById('uspTool').value=u.tool||'';document.getElementById('uspMonth').value=productionMonthInput(u.productionMonth);document.getElementById('uspSpec').value=u.spec||'';ensureSelectValue(document.getElementById('detailComponent'),d.component||'');document.getElementById('detailEyebrow').value=d.eyebrow||'';document.getElementById('detailHead').value=d.head||'';document.getElementById('detailAppliedTool').value=d.appliedTool||'';document.getElementById('detailBody').value=d.body||'';document.getElementById('detailDisclaimer').value=d.disclaimer||'';document.getElementById('detailAlt').value=d.alt||'';ensureSelectValue(document.getElementById('detailXf'),d.xf||'');document.getElementById('detailDam').value=d.masterDam||'';pendingImage=d.image||'';document.getElementById('uspSave').textContent='Update Common USP';window.scrollTo({top:0,behavior:'smooth'})}
function deleteItem(id){if(!confirm('Delete this Common USP and its detail content?'))return;const list=read(KEYS.list,[]),u=list.find(x=>x.id===id);set(KEYS.list,list.filter(x=>x.id!==id));if(u)set(KEYS.details,read(KEYS.details,[]).filter(d=>!(d.no===u.no||d.no.startsWith(u.no+'-'))));render();toast('Common USP deleted.')}
function resetForm(){document.getElementById('editId').value='';document.getElementById('uspSave').textContent='Save Common USP';pendingImage='';populateSubcategories()}
document.getElementById('uspImageFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>pendingImage=r.result;r.readAsDataURL(f)};
document.getElementById('uspForm').onsubmit=e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;const id=document.getElementById('editId').value,no=document.getElementById('uspNo').value.trim();const item={id:id||uid('usp'),no,name:document.getElementById('uspName').value.trim(),applicableProducts:document.getElementById('uspApplicable').value.trim(),category:document.getElementById('uspCategory').value,subCategory:document.getElementById('uspSubCategory').value.trim(),tool:document.getElementById('uspTool').value.trim(),productionMonth:document.getElementById('uspMonth').value.trim(),spec:document.getElementById('uspSpec').value.trim()};let list=read(KEYS.list,[]);list=id?list.map(x=>x.id===id?item:x):[...list,item];set(KEYS.list,list);let details=read(KEYS.details,[]),existing=details.find(d=>d.no===no);const detail={id:existing?.id||uid('detail'),no,name:item.name,image:pendingImage||existing?.image||'',component:document.getElementById('detailComponent').value.trim(),eyebrow:document.getElementById('detailEyebrow').value.trim(),head:document.getElementById('detailHead').value.trim(),body:document.getElementById('detailBody').value.trim(),disclaimer:document.getElementById('detailDisclaimer').value.trim(),alt:document.getElementById('detailAlt').value.trim(),appliedTool:document.getElementById('detailAppliedTool').value.trim(),xf:document.getElementById('detailXf').value.trim(),masterDam:document.getElementById('detailDam').value.trim()};details=existing?details.map(d=>d.id===existing.id?detail:d):[...details,detail];set(KEYS.details,details);e.currentTarget.reset();resetForm();render();toast(id?'Common USP updated.':'Common USP saved.')};document.getElementById('uspForm').onreset=()=>setTimeout(resetForm,0);
function xml(text){const d=new DOMParser().parseFromString(text,'application/xml');if(d.querySelector('parsererror'))throw new Error('Invalid XML in workbook');return d}
function dirname(p){return p.split('/').slice(0,-1).join('/')}function basename(p){return p.split('/').pop()}function resolvePath(baseFile,target){const parts=(dirname(baseFile)+'/'+target).split('/'),out=[];for(const p of parts){if(!p||p==='.')continue;if(p==='..')out.pop();else out.push(p)}return out.join('/')}
function relMap(doc){const m={};[...doc.getElementsByTagNameNS('*','Relationship')].forEach(r=>m[r.getAttribute('Id')]=r.getAttribute('Target'));return m}
function cellCol(ref){return (ref.match(/[A-Z]+/)||[''])[0]}function cellValue(c,shared){const t=c.getAttribute('t');if(t==='inlineStr')return [...c.getElementsByTagNameNS('*','t')].map(x=>x.textContent||'').join('');const v=c.getElementsByTagNameNS('*','v')[0];if(!v)return '';const raw=v.textContent||'';if(t==='s')return shared[Number(raw)]||'';if(t==='b')return raw==='1'?'TRUE':'FALSE';return raw}
async function sheetObjects(zip,path,shared){const doc=xml(await zip.file(path).async('text')),rows=[...doc.getElementsByTagNameNS('*','row')].map(r=>{const vals={};[...r.getElementsByTagNameNS('*','c')].forEach(c=>vals[cellCol(c.getAttribute('r')||'')]=cellValue(c,shared));return {row:Number(r.getAttribute('r')||0),vals}});if(!rows.length)return[];const headers=rows[0].vals;return rows.slice(1).filter(r=>Object.values(r.vals).some(v=>String(v).trim())).map(r=>{const o={__row:r.row};Object.entries(headers).forEach(([col,h])=>o[String(h).trim()]=r.vals[col]||'');return o})}
async function embeddedImages(zip,sheetPath){const relPath=dirname(sheetPath)+'/_rels/'+basename(sheetPath)+'.rels',relFile=zip.file(relPath);if(!relFile)return{};const srels=relMap(xml(await relFile.async('text'))),sheetDoc=xml(await zip.file(sheetPath).async('text')),drawing=sheetDoc.getElementsByTagNameNS('*','drawing')[0];if(!drawing)return{};const rid=drawing.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||drawing.getAttribute('r:id'),drawingPath=resolvePath(sheetPath,srels[rid]);const drawingFile=zip.file(drawingPath);if(!drawingFile)return{};const drawingRelPath=dirname(drawingPath)+'/_rels/'+basename(drawingPath)+'.rels',drels=relMap(xml(await zip.file(drawingRelPath).async('text'))),ddoc=xml(await drawingFile.async('text')),anchors=[...ddoc.getElementsByTagNameNS('*','oneCellAnchor'),...ddoc.getElementsByTagNameNS('*','twoCellAnchor')],map={};await Promise.all(anchors.map(async a=>{const from=[...a.children].find(x=>x.localName==='from');if(!from)return;const row=Number([...from.children].find(x=>x.localName==='row')?.textContent||0)+1,col=Number([...from.children].find(x=>x.localName==='col')?.textContent||0);if(col!==2)return;const blip=a.getElementsByTagNameNS('*','blip')[0];if(!blip)return;const br=blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed')||blip.getAttribute('r:embed'),target=drels[br];if(!target)return;const mediaPath=resolvePath(drawingPath,target),file=zip.file(mediaPath);if(!file)return;const ext=(mediaPath.split('.').pop()||'png').toLowerCase(),mime=ext==='jpg'||ext==='jpeg'?'image/jpeg':ext==='gif'?'image/gif':ext==='webp'?'image/webp':'image/png';map[row]='data:'+mime+';base64,'+await file.async('base64')}));return map}
function catCode(v){const n=String(v||'').trim().toLowerCase();return {'washer & dryer':'WM','refrigerator':'REF','vacuum cleaner':'VC','cooking appliance':'COOKING','cooking':'COOKING','dishwasher':'DW'}[n]||String(v||'').trim()||'ALL'}
async function importExcel(file){if(!window.JSZip)throw new Error('JSZip library is missing.');const buf=await file.arrayBuffer(),zip=await JSZip.loadAsync(buf),wbDoc=xml(await zip.file('xl/workbook.xml').async('text')),wbRels=relMap(xml(await zip.file('xl/_rels/workbook.xml.rels').async('text'))),sheets=[...wbDoc.getElementsByTagNameNS('*','sheet')].map(s=>({name:s.getAttribute('name'),rid:s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id')}));const paths=sheets.map(s=>({name:s.name,path:resolvePath('xl/workbook.xml',wbRels[s.rid])})),listSheet=paths.find(s=>s.name.toLowerCase()==='list')||paths[0],detailSheet=paths.find(s=>s.name.toLowerCase()==='detail')||paths[1];if(!listSheet||!detailSheet)throw new Error('The workbook must contain list and detail sheets.');let shared=[];const sf=zip.file('xl/sharedStrings.xml');if(sf){const sd=xml(await sf.async('text'));shared=[...sd.getElementsByTagNameNS('*','si')].map(si=>[...si.getElementsByTagNameNS('*','t')].map(t=>t.textContent||'').join(''))}const [lo,deo,images]=await Promise.all([sheetObjects(zip,listSheet.path,shared),sheetObjects(zip,detailSheet.path,shared),embeddedImages(zip,detailSheet.path)]);const list=lo.map((o,i)=>({id:'usp-'+(o['No.']||i+1)+'-'+i,no:String(o['No.']||'').trim(),name:String(o['Common USP']||'').trim(),applicableProducts:String(o['적용 가능 제품']||o['Applicable Products']||'').trim(),category:catCode(o['Category']),categoryLabel:String(o['Category']||'').trim(),subCategory:String(o['Sub-category']||'').trim(),tool:String(o['Tool']||'').trim(),productionMonth:productionMonthInput(String(o['제작 월']||o['Production Month']||'').trim())||String(o['제작 월']||o['Production Month']||'').trim(),spec:String(o['Spec.']||'').trim()}));const details=deo.map((o,i)=>({id:'detail-'+(o['No.']||i+1)+'-'+i,no:String(o['No.']||'').trim(),name:String(o['Common USP']||'').trim(),image:images[o.__row]||'',component:String(o['Component']||'').trim(),eyebrow:String(o['Eyebrow']||'').trim(),head:String(o['Title']||o['Head']||'').trim(),body:String(o['Body']||'').trim(),disclaimer:String(o['Disclaimer']||'').trim(),alt:String(o['Image alt text']||'').trim(),appliedTool:String(o['Applied PDPs (Tool)']||'').trim(),xf:String(o['X/F']||'').trim(),masterDam:String(o['Master DAM']||'').trim()}));if(!list.length)throw new Error('No data was found in the list sheet.');set(KEYS.list,list);set(KEYS.details,details);render();return {list:list.length,details:details.length,images:Object.keys(images).length}}
document.getElementById('excelImport').onclick=()=>document.getElementById('excelFile').click();
document.getElementById('excelFile').onchange=async()=>{const input=document.getElementById('excelFile'),file=input.files[0],st=document.getElementById('excelStatus');if(!file)return;st.textContent='Importing '+file.name+'...';try{const r=await importExcel(file);st.textContent=`Imported ${r.list} list items, ${r.details} detail records and ${r.images} images from ${file.name}.`;toast('Excel import completed.')}catch(e){console.error(e);st.textContent='Import failed: '+e.message;toast('Excel import failed.')}finally{input.value=''}};
document.getElementById('uspSearch').oninput=render;document.getElementById('categoryFilter').onchange=render;document.getElementById('uspCategory').onchange=()=>populateSubcategories();document.getElementById('modalClose').onclick=closeModal;document.getElementById('detailModal').onclick=e=>{if(e.target.id==='detailModal')closeModal()};document.getElementById('imageViewerClose').onclick=closeImageViewer;document.getElementById('imageViewer').onclick=e=>{if(e.target.id==='imageViewer')closeImageViewer()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('imageViewer').classList.contains('open'))closeImageViewer();else closeModal()}});populateSubcategories();seed();initSidebar();render();
