<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDP HS Energy Labeling 이미지 검출 — 국가·리전 분석</title>
<style>
:root{
  --red:#A50034; --red-soft:#F6E6EC; --ink:#111111; --g6:#262626; --g5:#595959; --g4:#8C8C8C; --g3:#BFBFBF;
  --g2:#E5E5E5; --g1:#F5F5F5; --bg:#FAFAFA; --surface:#FFFFFF; --border:#E5E5E5;
  --bar-mid:#9E9E9E; --bar-rv:#D9D9D9;
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F2F2F2;--g6:#1C1C1C;--g5:#B3B3B3;--g4:#8C8C8C;--g3:#5A5A5A;--g2:#333;--g1:#262626;--bg:#121212;--surface:#1A1A1A;--border:#333;--bar-mid:#7A7A7A;--bar-rv:#4A4A4A}}
:root[data-theme="dark"]{--ink:#F2F2F2;--g6:#1C1C1C;--g5:#B3B3B3;--g4:#8C8C8C;--g3:#5A5A5A;--g2:#333;--g1:#262626;--bg:#121212;--surface:#1A1A1A;--border:#333;--bar-mid:#7A7A7A;--bar-rv:#4A4A4A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.top-rule{height:3px;background:#000}
header.hd{background:var(--g6);color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 0 28px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hd h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hd p{color:#BDBDBD;font-size:13px;margin-top:6px}
.hd .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hd .chip{border:1px solid #4A4A4A;color:#D9D9D9;font-size:12px;padding:4px 10px;border-radius:999px}

main{padding:28px 0 64px}
section{margin-top:40px}
section:first-child{margin-top:0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.sec-h p{color:var(--g5);font-size:13px;margin-top:2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--border);background:var(--surface)}
.kpi{padding:20px 22px;border-right:1px solid var(--border)}
.kpi:last-child{border-right:0}
.kpi .lb{font-size:12px;color:var(--g5)}
.kpi .v{font-size:32px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:500;color:var(--g5);margin-left:3px}
.kpi .sub{font-size:12px;color:var(--g4);margin-top:2px}
.kpi.accent .v{color:var(--red)}

/* legend */
.legend{display:flex;gap:14px;font-size:12px;color:var(--g5);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}

/* region accordion */
.panel{background:var(--surface);border:1px solid var(--border)}
.reg{border-bottom:1px solid var(--border)}
.reg:last-child{border-bottom:0}
.reg-btn{width:100%;background:none;border:0;text-align:left;display:grid;
  grid-template-columns:150px 1fr 200px 20px;align-items:center;gap:20px;padding:16px 20px}
.reg-btn:hover{background:var(--g1)}
.reg-name{font-weight:700;font-size:15px}
.reg-name small{display:block;font-weight:400;font-size:12px;color:var(--g5)}
.reg-stats{display:grid;grid-template-columns:1fr;font-size:12px;color:var(--g5);text-align:right}
.reg-stats b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;transition:transform .2s;color:var(--g4)}
.reg.open .chev{transform:rotate(180deg)}
.reg-body{display:none;background:var(--bg);border-top:1px solid var(--border);padding:6px 20px 12px}
.reg.open .reg-body{display:block}

.bar{display:flex;height:12px;background:var(--g1);width:100%}
.bar i{display:block;height:100%}
.bar .hi{background:var(--red)} .bar .mid{background:var(--bar-mid)} .bar .rv{background:var(--bar-rv)}
.bar-wrap{display:flex;align-items:center;gap:10px}
.bar-wrap .num{font-size:13px;font-weight:700;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

.crow{width:100%;background:none;border:0;text-align:left;display:grid;
  grid-template-columns:150px 1fr 200px 20px;gap:20px;align-items:center;padding:10px 0;border-bottom:1px solid var(--g2)}
.crow:last-child{border-bottom:0}
.crow:hover .cname{color:var(--red)}
.cname{font-size:14px;font-weight:600}
.cname small{font-weight:400;color:var(--g4);font-size:12px;margin-left:4px}
.cmeta{font-size:12px;color:var(--g5);text-align:right}
.arrow{width:14px;height:14px;color:var(--g3)}

/* table */
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{border:1px solid var(--border);background:var(--surface);color:var(--g4);font-size:12px;padding:6px 12px;border-radius:999px}
.tbtn.on{background:var(--g6);color:#fff;border-color:var(--g6)}
.tscroll{overflow-x:auto;border:1px solid var(--border);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:var(--g1);color:var(--g5);font-weight:600;font-size:12px;padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);position:relative}
th.l,td.l{text-align:left}
th.sort{cursor:pointer;user-select:none}
th.sort.act{color:var(--ink)}
td{padding:10px 12px;border-bottom:1px solid var(--g2);text-align:right;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(165,0,52,.06)}
tfoot td{font-weight:700;background:var(--g1);border-bottom:0}
.pri{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border:1px solid var(--g3);color:var(--g5)}
.pri.p1{background:var(--red);border-color:var(--red);color:#fff}
.pri.p2{border-color:var(--red);color:var(--red)}
.zero{color:var(--g3)}
.mini{width:110px;display:inline-flex;vertical-align:middle}
.mini .bar-wrap{width:100%}

/* matrix */
.mx td{text-align:center;min-width:64px}
.mx th{text-align:center}
.mx td.l,.mx th.l{text-align:left}

.notes{margin-top:40px;border-top:1px solid var(--border);padding-top:18px;font-size:12px;color:var(--g5)}
.notes li{margin:4px 0 4px 16px}

/* bottom sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.dim.show{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:50%;bottom:0;width:min(860px,100%);max-height:84vh;background:var(--surface);
  transform:translate(-50%,100%);transition:transform .25s ease;z-index:51;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:translate(-50%,0);visibility:visible}
.sheet-h{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sheet-h h3{font-size:18px;font-weight:700}
.sheet-h p{font-size:12px;color:var(--g5);margin-top:2px}
.xbtn{background:none;border:1px solid var(--border);width:32px;height:32px;display:grid;place-items:center;flex:none}
.sheet-kpi{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.sheet-kpi div{padding:12px 22px;font-size:12px;color:var(--g5);border-right:1px solid var(--border)}
.sheet-kpi div:last-child{border-right:0}
.sheet-kpi b{display:block;font-size:18px;color:var(--ink)}
.sheet-body{overflow:auto;padding:4px 22px 22px}
.img-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--g2)}
.img-row .fn{font-size:13px;font-weight:600;word-break:break-all}
.img-row .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;border:1px solid var(--border);color:var(--g5);padding:1px 7px}
.tag.warn{border-color:var(--red);color:var(--red)}
.img-row .rt{text-align:right;font-size:12px;color:var(--g5)}
.img-row .rt b{display:block;font-size:18px;color:var(--ink)}
.img-row .rt a{color:var(--red);text-decoration:none}

@media (max-width:900px){
  .reg-btn,.crow{grid-template-columns:110px 1fr 20px}
  .reg-stats,.cmeta{display:none}
  .sheet-kpi{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .kpi .v{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="top-rule"></div>
<header class="hd">
  <div class="wrap">
    <h1>PDP HS Energy Labeling — 이미지 검출 국가별 분석</h1>
    <p>판정 “이미지 있음” 전건 기준, LG.com 리전 기준 Europe 23개국(Locale 자동추출)으로 집계한 결과입니다.</p>
    <div class="meta" id="meta"></div>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="kpis" id="kpis"></div>
  </section>


  <section>

      <div class="legend"><span><i style="background:var(--red)"></i>신뢰도 높음</span><span><i style="background:var(--bar-mid)"></i>보통</span><span><i style="background:var(--bar-rv)"></i>부분매칭</span></div>
    </div>
    <div class="tscroll"><table id="ctable"></table></div>
  </section>

  <section>

    <div class="tscroll"><table class="mx" id="matrix"></table></div>
  </section>

</main>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">

  </div>
  <div class="sheet-kpi" id="sh-kpi"></div>
  <div class="sheet-body" id="sh-body"></div>
</div>

 "rv": 0, "leg": 1, "cat": {"REF(냉장고)": 1}, "models": ["REF Energy A-20%"], "imgs": [{"fn": "Energy-Efficiency-A-20-Ref-PDP-01-1-Desktop.jpg", "url": "https://www.lg.com/fi/images/RF/features/Energy-Efficiency-A-20-Ref-PDP-01-1-Desktop.jpg", "n": 1, "cat": "REF(냉장고)", "model": "REF Energy A-20%", "m": "해시매칭", "p": "레거시(/images)", "d": 0.2}]}, {"reg": "Europe", "name": "슬로바키아", "iso": "SK", "locs": ["sk"], "n": 1, "u": 1, "hi": 0, "mid": 1, "rv": 0, "leg": 1, "cat": {"REF(냉장고)": 1}, "models": ["REF Energy A-20%"], "imgs": [{"fn": "Energy-Efficiency-A-20-Ref-PDP-01-1-Desktop.jpg", "url": "https://www.lg.com/sk/images/chladnicky/features/Energy-Efficiency-A-20-Ref-PDP-01-1-Desktop.jpg", "n": 1, "cat": "REF(냉장고)", "model": "REF Energy A-20%", "m": "해시매칭", "p": "레거시(/images)", "d": 0.2}]}, {"reg": "Europe", "name": "헝가리", "iso": "HU", "locs": ["hu"], "n": 1, "u": 1, "hi": 0, "mid": 0, "rv": 1, "leg": 0, "cat": {"VC(청소기)": 1}, "models": [], "imgs": [{"fn": "large09.jpg", "url": "https://www.lg.com/content/dam/channel/wcms/hu/images/porszivok/a9k-core3s-bfsqeur_eemk_hu_c/gallery/large09.jpg/jcr:content/renditions/thum-1600x1062.jpeg", "n": 1, "cat": "VC(청소기)", "model": "-", "m": "부분매칭(특징점)", "p": "AEM DAM", "d": null}]}], "regions": ["Europe"], "cats": ["WM(세탁기)", "REF(냉장고)", "WD(세탁건조기)", "VC(청소기)", "DW(식기세척기)", "RAC(에어컨)", "COOK(빌트인)", "기타(배너)", "공통(에너지라벨)"], "total": 352, "uniq": 126, "period": "2026-09-28 ~ 2026-09-29"};
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('ko-KR');
const pct = (a,b) => b ? (a/b*100).toFixed(1)+'%' : '-';
const CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6l5 5 5-5"/></svg>';
const ARR  = '<svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5"/></svg>';
const pri = n => n>=30?'P1':n>=10?'P2':'P3';
const C = D.countries, T = D.total;
const maxN = Math.max(...C.map(c=>c.n));
const R = D.regions.map(r=>{
  const cs=C.filter(c=>c.reg===r);
  const s=k=>cs.reduce((a,c)=>a+c[k],0);
  return {name:r,cs,n:s('n'),u:s('u'),hi:s('hi'),mid:s('mid'),rv:s('rv')};
});

$('#meta').innerHTML=[`검토기간 ${D.period} (KST)`,`원본 ${fmt(T)}건`].map(t=>`<span class="chip">${t}</span>`).join('');

/* KPI */
$('#kpis').innerHTML=`
 <div class="kpi accent"><div class="lb">총 검출건수</div><div class="v">${fmt(T)}<small>건</small></div><div class="sub">PDP 노출 기준</div></div>
 <div class="kpi"><div class="lb">검출 국가</div><div class="v">${C.length}<small>개국</small></div><div class="sub">Europe · 25 Locale</div></div>`;


/* bars */
const bar=(o,max)=>{const w=o.n/max*100;return `<div class="bar-wrap"><div class="bar" style="width:${Math.max(w,1.5)}%"><i class="hi" style="width:${o.hi/o.n*100}%"></i><i class="mid" style="width:${o.mid/o.n*100}%"></i><i class="rv" style="width:${o.rv/o.n*100}%"></i></div><span class="num">${o.n}</span></div>`};


/* country table */
const cols=[
 ['순위','rank'],['국가','name','l'],['검출','n'],['비중','share'],['고유 이미지','u'],['이미지당','per'],
 ['높음','hi'],['보통','mid'],['분포',null],['주요 모델라인','models','l'],['우선순위','pri']];
let sortK='n',sortD=-1,filt='전체';
const rows=C.map(c=>({...c,share:c.n/T,per:c.n/c.u,pri:pri(c.n)}));
rows.slice().sort((a,b)=>b.n-a.n).forEach((r,i)=>r.rank=i+1);
function renderTable(){
  let rs=rows.filter(r=>filt==='전체'||r.reg===filt);
  rs.sort((a,b)=>{const x=a[sortK],y=b[sortK];return (typeof x==='string'?x.localeCompare(y,'ko'):x-y)*sortD});
  const z=v=>v?fmt(v):'<span class="zero">-</span>';
  const s=k=>rs.reduce((a,r)=>a+r[k],0);
  $('#ctable').innerHTML=`<thead><tr>${cols.map(([h,k,a])=>`<th class="${a||''}${k&&k!=='models'?' sort':''}${k===sortK?' act':''}" data-k="${k||''}">${h}${k===sortK?(sortD<0?' ↓':' ↑'):''}</th>`).join('')}</tr></thead>
  <tbody>${rs.map(r=>`<tr data-c="${r.name}"><td>${r.rank}</td><td class="l"><b>${r.name}</b></td><td><b>${r.n}</b></td><td>${(r.share*100).toFixed(1)}%</td><td>${r.u}</td><td>${r.per.toFixed(1)}</td><td>${z(r.hi)}</td><td>${z(r.mid)}</td><td><span class="mini">${bar(r,maxN).replace('<span class="num">'+r.n+'</span>','')}</span></td><td class="l">${r.models.join(', ')||'-'}</td><td><span class="pri ${r.pri.toLowerCase()}">${r.pri}</span></td></tr>`).join('')}</tbody>
  <tfoot><tr><td class="l">합계</td><td class="l">${rs.length}개국</td><td>${s('n')}</td><td>${pct(s('n'),T)}</td><td>${s('u')}</td><td>${(s('n')/s('u')).toFixed(1)}</td><td>${s('hi')}</td><td>${s('mid')}</td><td></td><td></td><td></td></tr></tfoot>`;
  document.querySelectorAll('#ctable th.sort').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)sortD*=-1;else{sortK=k;sortD=(k==='name'||k==='reg'||k==='rank'||k==='pri')?1:-1}renderTable()});
  document.querySelectorAll('#ctable tbody tr').forEach(tr=>tr.onclick=()=>openSheet(tr.dataset.c));
}
renderTable();

/* matrix */
const maxCell=Math.max(...C.flatMap(c=>Object.values(c.cat)));
const ordered=C.slice().sort((a,b)=>b.n-a.n);
$('#matrix').innerHTML=`<thead><tr><th class="l">국가</th>${D.cats.map(k=>`<th>${k.replace('(','<br>(')}</th>`).join('')}<th>합계</th></tr></thead>
<tbody>${ordered.map(c=>`<tr data-c="${c.name}"><td class="l"><b>${c.name}</b></td>${D.cats.map(k=>{const v=c.cat[k]||0;const a=v?0.08+0.82*(v/maxCell):0;return `<td style="background:rgba(165,0,52,${a.toFixed(2)});color:${a>.5?'#fff':'inherit'}">${v||'<span class="zero">-</span>'}</td>`}).join('')}<td><b>${c.n}</b></td></tr>`).join('')}</tbody>
<tfoot><tr><td class="l">합계</td>${D.cats.map(k=>`<td>${C.reduce((a,c)=>a+(c.cat[k]||0),0)}</td>`).join('')}<td>${T}</td></tr></tfoot>`;
document.querySelectorAll('#matrix tbody tr').forEach(tr=>tr.onclick=()=>openSheet(tr.dataset.c));


/* sheet */
function openSheet(name){
  const c=C.find(x=>x.name===name);
  $('#sh-title').textContent=c.name;
  $('#sh-sub').textContent=`${c.reg} · Locale ${c.locs.join(', ')} · 우선순위 ${pri(c.n)}`;
  $('#sh-kpi').innerHTML=`<div><b>${c.n}</b>검출건수</div><div><b>${c.u}</b>고유 이미지</div><div><b>${c.hi}</b>신뢰도 높음</div><div><b>${c.mid}</b>신뢰도 보통</div>`;
  $('#sh-body').innerHTML=c.imgs.slice().sort((a,b)=>b.n-a.n).map(i=>`
   <div class="img-row"><div><div class="fn">${i.fn}</div>
    <div class="tags"><span class="tag">${i.cat}</span>${i.model!=='-'?`<span class="tag">${i.model}</span>`:''}<span class="tag">${i.p}</span>${i.m!=='해시매칭'?'<span class="tag warn">부분매칭 · 확인필요</span>':`<span class="tag">신호거리 ${i.d.toFixed(2)}</span>`}</div></div>
    <div class="rt"><b>${i.n}</b>건 검출<br><a href="${i.url}" target="_blank" rel="noopener">이미지 열기</a></div></div>`).join('');
  $('#dim').classList.add('show');$('#sheet').classList.add('show');$('#sh-close').focus();
}
function closeSheet(){$('#dim').classList.remove('show');$('#sheet').classList.remove('show')}
$('#dim').onclick=closeSheet;$('#sh-close').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script>
</body>
</html>
